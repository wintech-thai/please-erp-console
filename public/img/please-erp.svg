<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#grad)" />
  <!-- ERP document icon -->
  <rect x="34" y="26" width="40" height="52" rx="4" fill="white" opacity="0.15"/>
  <rect x="34" y="26" width="40" height="52" rx="4" stroke="white" stroke-width="2.5" fill="none"/>
  <!-- Document lines -->
  <line x1="42" y1="40" x2="66" y2="40" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="50" x2="66" y2="50" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="60" x2="58" y2="60" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Gear/settings icon bottom-right -->
  <circle cx="76" cy="80" r="14" fill="url(#grad2)"/>
  <circle cx="76" cy="80" r="5" fill="white"/>
  <circle cx="76" cy="80" r="5" fill="none" stroke="white" stroke-width="2"/>
  <!-- Gear teeth -->
  <rect x="74.5" y="63" width="3" height="5" rx="1.5" fill="white"/>
  <rect x="74.5" y="89" width="3" height="5" rx="1.5" fill="white"/>
  <rect x="63" y="78.5" width="5" height="3" rx="1.5" fill="white"/>
  <rect x="84" y="78.5" width="5" height="3" rx="1.5" fill="white"/>
  <rect x="65.9" y="67.9" width="3" height="5" rx="1.5" fill="white" transform="rotate(45 65.9 67.9)"/>
  <rect x="83.1" y="85.1" width="3" height="5" rx="1.5" fill="white" transform="rotate(45 83.1 85.1)"/>
  <rect x="65.9" y="85.1" width="5" height="3" rx="1.5" fill="white" transform="rotate(45 65.9 85.1)"/>
  <rect x="83.1" y="67.9" width="5" height="3" rx="1.5" fill="white" transform="rotate(45 83.1 67.9)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="grad2" x1="62" y1="66" x2="90" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
